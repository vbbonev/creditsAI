<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Login service unavailable</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>We couldn't log you in because the login service is not responding. Please try again in a moment.</p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-flat-button (click)="retry()">Try again</button>
  </mat-card-actions>
</mat-card>
