# Forwarded headers for /api/ and /auth/. Always overwrite, never append ($proxy_add_x_forwarded_for
# would let a client fake its IP in Keycloak's events and brute-force detection). Host must stay
# "localhost": the backend allows no CORS origins, so with Host backend:8080 every same-origin
# POST/PUT/DELETE (which carries Origin: http://localhost) would get 403.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
# The access token travels in the Authorization header: never add $http_authorization to a log_format.
