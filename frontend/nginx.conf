# The single entry point on http://localhost: the Angular SPA, /api/ -> backend, /auth/ -> Keycloak.
server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;

    # Docker's DNS. Upstreams are looked up per request (proxy_pass with a variable), so a rebuilt
    # backend or Keycloak container with a new IP is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The backend maps its endpoints under /api itself, so the URI is passed on unchanged.
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Keycloak runs with KC_HTTP_RELATIVE_PATH=/auth, so the URI is passed on unchanged.
    location /auth/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        include /etc/nginx/snippets/proxy-headers.conf;
        # Keycloak's login responses carry large cookies and headers
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        # Keycloak unreachable (e.g. still starting): a friendly page instead of nginx's plain 502.
        # Only nginx's own errors are replaced; Keycloak's responses pass through unchanged
        # (no proxy_intercept_errors).
        error_page 502 503 504 /auth-unavailable.html;
    }

    location = /auth-unavailable.html {
        internal;
        root /usr/share/nginx/errors;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "10" always;
    }

    # SPA: hashed bundles and fonts; unknown paths fall back to index.html (client-side routing).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }

    # Never cache index.html, so a rebuild with new bundle hashes is picked up at once.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
