# Security headers for the SPA (index.html and its assets). Included only in the SPA locations:
# /auth/ must not get them, because Keycloak sends its own headers and the SPA frames its
# login-status iframe. Everything is self-hosted, so the CSP allows 'self' only; 'unsafe-inline'
# for styles is needed by Angular/Material component styles. img-src allows blob: for attachment
# picture previews (fetched with the bearer token, shown through URL.createObjectURL).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
