<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login service unavailable · creditsAI</title>
    <!-- Served by nginx when Keycloak (/auth/) can't be reached. Self-contained: no scripts, no
         external resources, so it works under the SPA's CSP and while the app itself can't log in. -->
    <style>
      :root {
        color-scheme: light dark;
        --surface: light-dark(#faf9fd, #121316);
        --on-surface: light-dark(#1a1b1f, #e3e2e6);
        --outline: light-dark(#c4c6d0, #44474e);
        --primary: light-dark(#005cbb, #abc7ff);
        --on-primary: light-dark(#ffffff, #002f65);
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--surface);
        color: var(--on-surface);
        font: 400 1rem/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 480px;
        margin: 16px;
        padding: 24px;
        border: 1px solid var(--outline);
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.375rem;
        font-weight: 400;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 24px;
        border-radius: 9999px;
        background: var(--primary);
        color: var(--on-primary);
        font-weight: 500;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Login service unavailable</h1>
      <p>The login service is not responding. If the app was just started, it may still be starting up. Please try again in a moment.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
