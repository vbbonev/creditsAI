# The backend always runs in Docker (docker compose up -d --build --wait).
# The browser reaches everything through the frontend nginx on http://localhost; the backend reaches
# the other containers by their service names. Passwords come from compose environment variables.
spring:
  application:
    name: creditsai-backend
  datasource:
    url: jdbc:postgresql://postgres:5432/credits
    username: credits
    password: ${CREDITS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      # Consistent with app.attachments: one file at most 5 MB; a request carries up to 20 MB of
      # files in total plus the client JSON and multipart overhead
      max-file-size: 5MB
      max-request-size: 21MB
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    web:
      pageable:
        # Stable page JSON: {content, page: {size, number, totalElements, totalPages}}
        serialization-mode: via-dto
        # Larger ?size= values are clamped to this
        max-page-size: 100
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri is never called: it is only compared with the token's "iss" claim, which is
          # the public URL the browser used (Keycloak behind nginx at /auth) ...
          issuer-uri: http://localhost/auth/realms/credits
          # ... while signing keys are fetched from Keycloak directly over the internal network.
          jwk-set-uri: http://keycloak:8080/auth/realms/credits/protocol/openid-connect/certs

server:
  tomcat:
    # Multipart parts per request: 30 files + the client JSON part + margin (app.attachments.max-files is enforced separately)
    max-part-count: 32
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    # Only tokens whose "azp" (authorized party) is this Keycloak client are accepted
    client-id: credits-web
  attachments:
    # Files live in {storage-dir}/{clientId}/{fileName} (a Docker volume in compose)
    storage-dir: /data/attachments
    max-file-size: 5MB
    max-total-size: 20MB
    max-files: 30
    cleanup:
      # Runs at startup and then this long after each run; removes old .deleted-*/.upload-*.tmp
      # leftovers and only reports files without a row and rows without a file
      interval: 1h
      # Only files older than this are touched or reported (protects uploads/deletes in progress)
      min-age: 15m
